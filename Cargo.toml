[workspace]
members = ["src-tauri", "crates/arachnid-core", "crates/arachnid-detector", "crates/arachnid-diagnostics", "crates/arachnid-launch", "crates/arachnid-repair", "crates/arachnid-settings", "crates/arachnid-saveguard", "crates/arachnid-mods", "tests/process-harness"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-2.0-only"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
arachnid-core = { path = "crates/arachnid-core" }
arachnid-detector = { path = "crates/arachnid-detector" }
arachnid-diagnostics = { path = "crates/arachnid-diagnostics" }
arachnid-launch = { path = "crates/arachnid-launch" }
arachnid-repair = { path = "crates/arachnid-repair" }
arachnid-settings = { path = "crates/arachnid-settings" }
arachnid-saveguard = { path = "crates/arachnid-saveguard" }
arachnid-mods = { path = "crates/arachnid-mods" }
