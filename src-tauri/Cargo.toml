[package]
name = "arachnid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "arachnid_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
arachnid-core.workspace = true
arachnid-detector.workspace = true
arachnid-diagnostics.workspace = true
arachnid-launch.workspace = true
arachnid-repair.workspace = true
arachnid-settings.workspace = true
arachnid-saveguard.workspace = true
arachnid-mods.workspace = true
